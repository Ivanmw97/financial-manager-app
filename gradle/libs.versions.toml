[versions]
agp                   = "8.7.3"
bom                   = "3.1.4"
coreKtx               = "1.16.0"
dotenvKotlin = "6.4.1"
junit                 = "4.13.2"
junitVersion          = "1.2.1"
espressoCore          = "3.6.1"
kotlinxSerializationJson = "1.6.3"
lifecycleRuntimeKtx   = "2.8.7"
activityCompose       = "1.10.1"
composeBom            = "2025.04.00"
appcompat             = "1.7.0"
material              = "1.12.0"
room                  = "2.7.0"
koin                  = "3.5.3"
kotlin                = "1.9.10"
ksp                   = "1.9.10-1.0.13"
supabase              = "2.0.3"
ktorVersion = "2.3.9"

[libraries]
androidx-core-ktx           = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
bom                         = { module = "io.github.jan-tennert.supabase:bom", version.ref = "bom" }
dotenv-kotlin = { module = "io.github.cdimascio:dotenv-kotlin", version.ref = "dotenvKotlin" }
gotrue-kt = { module = "io.github.jan-tennert.supabase:gotrue-kt", version.ref = "supabase" }
postgrest-kt = { module = "io.github.jan-tennert.supabase:postgrest-kt", version.ref = "supabase" }
supabase-serialization-kotlinx = { module = "io.github.jan-tennert.supabase:serialization-kotlinx", version.ref = "supabase" }
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

androidx-junit          = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core  = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

androidx-appcompat      = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-material3      = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom    = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui             = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics    = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling     = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest   = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4     = { group = "androidx.compose.ui", name = "ui-test-junit4" }

androidx-room-runtime    = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx        = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler   = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing    = { group = "androidx.room", name = "room-testing", version.ref = "room" }

koin-core               = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android            = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }

androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
junit                         = { group = "junit",       name = "junit",                version.ref = "junit" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktorVersion" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktorVersion" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktorVersion" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktorVersion" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktorVersion" }

[plugins]
android-application     = { id = "com.android.application", version.ref = "agp" }
android-library         = { id = "com.android.library",     version.ref = "agp" }
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android          = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
